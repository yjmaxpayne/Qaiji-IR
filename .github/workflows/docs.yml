# Sphinx 文档构建守卫。
#
# 以 -W 严格模式构建：docstring 交叉引用失效、rst 语法错误、孤立页面等
# 都会让流水线变红。宽松模式下文档腐烂无人察觉，该 job 也就失去信号价值。
# --keep-going 让 Sphinx 收集完所有问题再退出，便于一次性修复。
#
# 只有推送到 main 的构建会发布到 GitHub Pages；PR 只构建并上传 artifact，
# 避免未合并的改动覆盖线上文档。部署拆成独立 job，只有它持有 pages 写权限。
name: Docs

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-docs:
    name: build Sphinx HTML
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      UV_PYTHON: '3.13'

    steps:
      # 完整历史才能让 conf.py 用 git describe 找到最近的发布 tag，侧栏版本号依赖它。
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      # autodoc 需要导入 qaiji，uv sync 会同时以可编辑方式安装本项目。
      - name: Install dependencies
        run: uv sync --locked --group docs

      - name: Build documentation (warnings as errors)
        run: uv run make -C doc html SPHINXOPTS="-W --keep-going"

      - name: Test documentation examples (warnings as errors)
        run: uv run --no-sync make -C doc doctest SPHINXOPTS="-W --keep-going"

      - name: Upload documentation artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: documentation-html
          path: doc/build/html/
          retention-days: 14

      - name: Configure GitHub Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: doc/build/html/

  deploy-pages:
    name: deploy GitHub Pages
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build-docs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    # 部署串行执行且不取消进行中的发布，避免两次推送互相打断导致站点半更新。
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
