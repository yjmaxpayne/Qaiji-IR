<svg xmlns="http://www.w3.org/2000/svg" width="600" height="784" viewBox="0 0 600 784" font-family="Noto Sans CJK SC, Source Han Sans SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="11" role="img" aria-labelledby="title desc">
<title id="title">开济 IR 八层家族与侧层 P / T</title>
<desc id="desc">应用意图依次向下经过 L5、L4、L3、L2、L1 和 L0。L4 是语义契约层。P 与 L4 双向交换，也与 L1 和 L0 相连。T 从 L3、L1 和 L0 收集轨迹。虚线表示动力学、轨迹与主层之间规划中的交换。</desc>
<defs>
 <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#1d4ed8"/></marker>
 <marker id="arrowP" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#047857"/></marker>
 <marker id="arrowT" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#b45309"/></marker>
</defs>
<rect width="600" height="784" fill="white"/>
<g fill="#1f2937">
<text x="300" y="20" text-anchor="middle" font-size="14" font-weight="bold" fill="#1f2937">开济 IR 八层家族与侧层 P / T</text>
<rect x="10" y="35" width="340" height="34" rx="5" fill="#eef2ff" stroke="#312e81"/>
<text x="180" y="57" text-anchor="middle" font-size="13" font-weight="bold">应用意图</text>
<path d="M28,69 V106" stroke="#1d4ed8" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="48" y="92">提升（前端：OpenQASM / Python / 内核）</text>
<rect x="10" y="108" width="340" height="52" rx="5" fill="#dbeafe" stroke="#1d4ed8"/>
<text x="22" y="128" font-size="13" font-weight="bold">L5  程序 IR</text>
<text x="22" y="148">内核 · 测量批次 · 实验结构 · 参数绑定</text>
<path d="M28,160 V198" stroke="#1d4ed8" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="48" y="183">绑定（程序 → 语义态射族）</text>
<rect x="10" y="200" width="340" height="80" rx="5" fill="#fef3c7" stroke="#b45309" stroke-width="3"/>
<text x="22" y="221" font-size="13" font-weight="bold">L4  语义 IR</text>
<text x="182" y="221" font-weight="bold" fill="#92400e">[语义契约]</text>
<text x="22" y="242">态射类型 · 等价级别 · 测量句柄</text>
<text x="22" y="261">条件模型 · Cartan 角色 · 规范摘要哈希</text>
<path d="M28,280 V318" stroke="#1d4ed8" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="48" y="303">展开（语义 → 经典 + 量子图）</text>
<rect x="10" y="320" width="340" height="62" rx="5" fill="#dbeafe" stroke="#1d4ed8"/>
<text x="22" y="340" font-size="13" font-weight="bold">L3  混合控制 IR</text>
<text x="22" y="358">经典分支 · 循环 · FPROC 条件</text>
<text x="22" y="374">寄存器 ALU · 反馈边</text>
<path d="M28,382 V420" stroke="#1d4ed8" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="48" y="405">合法化 + 调度（原生门集 + ABI）</text>
<rect x="10" y="422" width="340" height="52" rx="5" fill="#dbeafe" stroke="#1d4ed8"/>
<text x="22" y="442" font-size="13" font-weight="bold">L2  原生调度 IR</text>
<text x="22" y="462">原生门 · 拓扑 · 时序 · 资源绑定</text>
<path d="M28,474 V510" stroke="#1d4ed8" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="48" y="497">脉冲降级（包络 · 相位 · port）</text>
<rect x="10" y="512" width="340" height="52" rx="5" fill="#dbeafe" stroke="#1d4ed8"/>
<text x="22" y="532" font-size="13" font-weight="bold">L1  脉冲 IR</text>
<text x="22" y="552">脉冲 · 脉冲序列 · frame · port · 读出</text>
<path d="M28,564 V600" stroke="#1d4ed8" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="48" y="587">物化（DAC / NCO / DDC / RTL 轨迹）</text>
<rect x="10" y="602" width="340" height="52" rx="5" fill="#dbeafe" stroke="#1d4ed8"/>
<text x="22" y="622" font-size="13" font-weight="bold">L0  波形 IR</text>
<text x="22" y="642">采样波形 · 时序网格 · 通道复用</text>
<rect x="390" y="200" width="202" height="112" rx="5" fill="#dcfce7" stroke="#047857"/>
<text x="491" y="221" text-anchor="middle" font-size="13" font-weight="bold">P  动力学 IR</text>
<text x="402" y="244">Hamiltonian · 坍缩</text>
<text x="402" y="265">求解器策略</text>
<text x="402" y="286">投影（规划中）</text>
<path d="M350,240 H390" stroke="#047857" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrowP)"/>
<path d="M390,260 H350" stroke="#047857" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrowP)"/>
<path d="M350,538 C370,538 370,291 390,291" stroke="#047857" stroke-width="1.2" stroke-dasharray="3,3" fill="none"/>
<path d="M350,628 C378,628 378,304 390,304" stroke="#047857" stroke-width="1.2" stroke-dasharray="3,3" fill="none"/>
<rect x="390" y="486" width="202" height="150" rx="5" fill="#fef3c7" stroke="#a16207"/>
<text x="491" y="507" text-anchor="middle" font-size="13" font-weight="bold">T  轨迹 IR</text>
<text x="402" y="525">运行日志（部分）</text>
<text x="402" y="542">分支决策</text>
<text x="402" y="559">测量事件</text>
<text x="402" y="576">元数据；证明证书（规划中）</text>
<text x="402" y="610" fill="#92400e">从 L3 / L1 / L0 读取决策</text>
<path d="M350,362 C363,362 363,522 390,522" stroke="#b45309" stroke-width="1.2" stroke-dasharray="3,3" fill="none" marker-end="url(#arrowT)"/>
<path d="M350,540 H390" stroke="#b45309" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrowT)"/>
<path d="M350,630 C370,630 370,579 390,579" stroke="#b45309" stroke-width="1.2" stroke-dasharray="3,3" fill="none" marker-end="url(#arrowT)"/>
<rect x="10" y="676" width="582" height="100" rx="4" fill="#f9fafb" stroke="#d1d5db"/>
<text x="22" y="695" font-weight="bold">图例</text>
<path d="M22,711 H55" stroke="#1d4ed8" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="64" y="715">主降级路径（实线）</text>
<path d="M310,711 H343" stroke="#047857" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrowP)"/>
<text x="352" y="715">P 动力学交换（虚线）</text>
<path d="M22,733 H55" stroke="#b45309" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrowT)"/>
<text x="64" y="737">T 轨迹收集（虚线）</text>
<rect x="310" y="725" width="12" height="12" fill="#fef3c7" stroke="#b45309" stroke-width="2"/>
<text x="332" y="737">语义契约（L4）</text>
<rect x="22" y="750" width="12" height="12" fill="#dbeafe" stroke="#1d4ed8"/>
<text x="44" y="761">主层 L5 / L3 / L2 / L1 / L0</text>
<rect x="270" y="750" width="12" height="12" fill="#dcfce7" stroke="#047857"/>
<text x="292" y="761">P 动力学 IR</text>
<rect x="416" y="750" width="12" height="12" fill="#fef3c7" stroke="#a16207"/>
<text x="438" y="761">T 轨迹 IR</text>
</g>
</svg>
