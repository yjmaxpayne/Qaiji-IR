[project]
name = "qaiji-ir"
description = "Qaiji-IR (开济IR): a cross-layer quantum-classical digital-twin intermediate representation for hybrid quantum computing."
readme = "README.md"
license = "Apache-2.0"
authors = [
    { name = "Ye Jun", email = "yjmaxpayne@hotmail.com" }
]
keywords = ["quantum", "quantum-classical", "intermediate-representation", "digital-twin", "pulse", "openqasm", "compiler"]
requires-python = ">=3.12,<3.15"
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Physics",
]
dynamic = ["version"]
dependencies = [
    # OpenQASM3 parser — consumed as a front-end adapter (not a semantic authority).
    "openqasm3[parser]>=1.0.1,<2.0.0",
]

[project.urls]
Homepage = "https://github.com/yjmaxpayne/Qaiji-IR"

[tool.poetry]
# Distribution name is "qaiji-ir" (PyPI); import name is "qaiji" (scikit-learn -> sklearn
# pattern). `version` is a fallback placeholder used only when no git tag is found;
# the real version comes from git tags via poetry-dynamic-versioning at build time.
packages = [{ include = "qaiji", from = "src" }]

# =============================================================================
# Dependency groups (PEP 735) — selected via `uv sync --group <name>`
# =============================================================================
version = "0.0.0"
[dependency-groups]
tests = [
    "pytest>=9.0,<10.0",
    "pytest-cov>=7.0,<8.0",
    "pytest-xdist>=3.6,<4.0",
    "hypothesis>=6.120.0,<7.0.0",
]
analysis = [
    "ruff>=0.15.0",
    "mypy>=1.17.0,<2.0.0",
    "pre-commit>=4.0.0,<5.0.0",
    "commitizen>=4.10.1,<5.0.0",
]
docs = [
    "sphinx>=9.1.0,<10.0.0",
    "furo>=2025.12.19,<2026.0.0",
    "myst-parser>=5.1.0,<6.0.0",
    "poethepoet>=0.48.0,<0.49.0",
]

[tool.uv]
default-groups = []

[tool.poe.tasks]
test = "pytest"
lint = "ruff check src tests"
lint-fix = "ruff check --fix src tests"
format = "ruff format src tests"
format-check = "ruff format --check src tests"
typecheck = "mypy src"
changelog = "cz changelog"
docs = "make -C doc html"
docs-doctest = "make -C doc doctest"
docs-clean = "make -C doc clean"

# ── Ruff: unified linter + formatter (replaces black, isort, flake8) ─────────
[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "RUF",  # ruff-specific rules
]
ignore = [
    "E501",    # line too long (handled by ruff-format)
    "RUF001",  # ambiguous unicode in string (Chinese text is intentional)
    "RUF002",  # ambiguous unicode in docstring (Chinese text is intentional)
    "RUF003",  # ambiguous unicode in comment (Chinese text is intentional)
]
fixable = ["ALL"]

[tool.ruff.lint.isort]
known-first-party = ["qaiji"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
check_untyped_defs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests/"]
addopts = [
    "--cov=qaiji",
    "--cov-fail-under=90",
    "--cov-report=xml",
    "--cov-report=term-missing",
    "-n", "auto",
    "-rfEs",
]
markers = [
    "integration: integration tests across the codec/core boundary",
    "physics: basis-convention / numerical fidelity tests (HP tolerance)",
    "pbt: property-based tests using Hypothesis",
]

[tool.coverage.run]
source = ["src/qaiji"]
omit = ["*/tests/*", "*/test_*.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "^\\s*\\.\\.\\.\\s*$",
]

[build-system]
requires = ["poetry-core>=1.0.0", "poetry-dynamic-versioning>=1.0.0,<2.0.0"]
build-backend = "poetry_dynamic_versioning.backend"

# =============================================================================
# Version Management: poetry-dynamic-versioning (single source of truth: git tags)
# =============================================================================
[tool.poetry-dynamic-versioning]
enable = true
vcs = "git"
style = "pep440"
pattern = "^v?(?P<base>\\d+\\.\\d+\\.\\d+)(-(?P<stage>[a-zA-Z]+)\\.?(?P<revision>\\d+)?)?$"

[tool.poetry-dynamic-versioning.substitution]
files = ["src/qaiji/version.py"]
patterns = [
    "(^__version__\\s*(?::.*?)?=\\s*['\"])[^'\"]*(['\"])"
]

# =============================================================================
# Changelog Automation: Commitizen (Conventional Commits)
# =============================================================================
[tool.commitizen]
name = "cz_conventional_commits"
version_provider = "scm"
tag_format = "v$version"
version_scheme = "semver"
changelog_file = "CHANGELOG.md"
update_changelog_on_bump = false
changelog_incremental = true
